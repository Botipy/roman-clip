<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; media-src 'self' file:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'">
<title>Roman Clip</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="settings.css">
</head>
<body>
<div class="bg-grid"></div>

<header class="titlebar">
  <div class="tb-title"><img src="../assets/icon.png" alt=""><b>ROMAN CLIP</b><span id="ver" class="tb-ver"></span></div>
  <div class="tb-btns">
    <button id="langBtn" class="lang" title="Language / Język">EN</button>
    <button id="wMin" data-i18n-title="tbMin"><svg viewBox="0 0 24 24"><path d="M5 17h14"/></svg></button>
    <button id="wClose" class="x" data-i18n-title="tbClose"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
</header>

<div class="scroll"><div class="wrap">

  <section class="hud">
    <div class="hud-top">
      <img class="hud-logo" src="../assets/icon.png" alt="">
      <div class="hud-id">
        <h1>ROMAN CLIP</h1>
        <p class="tag">// EDGERUNNER RECORDER</p>
      </div>
      <div id="state" class="chip">…</div>
    </div>
    <div class="hud-meta" id="meta"></div>
    <div class="hud-actions">
      <button id="clipNow" class="rec-btn"><i class="dot"></i><span data-i18n="saveClip"></span><kbd id="hkBtn"></kbd></button>
      <button id="pauseBtn" class="pause-btn"><svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg><span data-i18n="pause"></span></button>
    </div>
    <div id="pausedBanner" class="paused-banner" data-i18n="pausedBanner" hidden></div>
  </section>

  <div class="updbar"><span class="upd-dot"></span><span id="updText">…</span><button id="updBtn" class="btn sm"></button></div>

  <nav class="tabs">
    <button class="tab on" data-tab="rec" data-i18n="tabSettings"></button>
    <button class="tab" data-tab="clips"><span data-i18n="tabClips"></span> <em id="clipCount">0</em></button>
  </nav>

  <!-- ===================== SETTINGS ===================== -->
  <div id="tab-rec" class="pane">

    <section class="card">
      <h2><b>01</b> <span data-i18n="c1"></span></h2>
      <div class="row"><label data-i18n="lblLength"></label>
        <div class="slider"><input type="range" data-key="seconds" min="5" max="300" step="5"><span class="val"></span></div></div>
      <div class="row"><label data-i18n="lblAfter"></label>
        <div class="slider"><input type="range" data-key="afterSeconds" min="0" max="30" step="1"><span class="val"></span></div></div>
      <div class="row"><label data-i18n="lblFps"></label>
        <div class="seg" data-key="fps"><button data-v="30">30</button><button data-v="60">60</button><button data-v="90">90</button><button data-v="120">120</button></div></div>
      <div class="row"><label data-i18n="lblRes"></label>
        <div class="seg" data-key="height"><button data-v="0" data-i18n="resNative"></button><button data-v="1440">1440P</button><button data-v="1080">1080P</button><button data-v="720">720P</button><button data-v="480">480P</button></div></div>
      <div class="row"><label data-i18n="lblQuality"></label>
        <div class="seg" data-key="quality"><button data-v="low" data-i18n="qLow"></button><button data-v="medium" data-i18n="qMed"></button><button data-v="high" data-i18n="qHigh"></button><button data-v="ultra" data-i18n="qMax"></button></div></div>
      <div class="row"><label data-i18n="lblCodec"></label>
        <div class="seg" data-key="codec"><button data-v="h264">H.264</button><button data-v="hevc" data-i18n="codecH265"></button></div></div>
      <div class="est" id="est"></div>
      <p class="hint" data-i18n="hint1"></p>
    </section>

    <section class="card">
      <h2><b>02</b> <span data-i18n="c2"></span></h2>
      <div class="row"><label data-i18n="lblMonitor"></label><select data-key="monitor" id="monitor"></select></div>
      <div class="row"><label data-i18n="lblCapture"></label>
        <select data-key="captureMode"><option value="auto" data-i18n="capAuto"></option><option value="ddagrab" data-i18n="capDda"></option><option value="gdigrab" data-i18n="capGdi"></option></select></div>
      <div class="row"><label data-i18n="lblEncoder"></label>
        <select data-key="encoder"><option value="auto" data-i18n="encAuto"></option><option value="h264_nvenc" data-i18n="encNvenc"></option><option value="h264_amf" data-i18n="encAmf"></option><option value="h264_qsv" data-i18n="encQsv"></option><option value="libx264" data-i18n="encX264"></option></select></div>
      <label class="tog"><input type="checkbox" data-key="systemAudio"><span class="sw"></span><span class="t" data-i18n="togSysAudio"></span></label>
      <div class="row"><label data-i18n="lblAudio"></label><select data-key="audioDevice" id="audioDevice"></select></div>
      <p class="hint" data-i18n="hint2"></p>
    </section>

    <section class="card">
      <h2><b>03</b> <span data-i18n="c3"></span></h2>
      <div class="row"><label data-i18n="lblHotkey"></label>
        <div class="hk"><div id="hkCaps" class="caps"></div><button id="hkChange" class="btn sm" data-i18n="hkChange"></button></div></div>
      <p class="hint" id="hotkeyMsg"></p>
      <label class="tog"><input type="checkbox" data-key="voiceEnabled"><span class="sw"></span><span class="t" data-i18n="togVoice"></span></label>
      <div class="row"><label data-i18n="lblPhrase"></label><input type="text" data-key="voicePhrase" data-i18n-ph="phPhrase" spellcheck="false"></div>
      <div class="row"><label data-i18n="lblMic"></label><select data-key="micId" id="micId"></select></div>
      <div id="modelBox">
        <button id="modelBtn" class="btn"></button>
        <div class="bar"><div id="modelBar"></div></div>
        <p class="hint" id="modelMsg"></p>
      </div>
      <p class="hint" data-i18n="hint3"></p>
    </section>

    <section class="card">
      <h2><b>04</b> <span data-i18n="c4"></span></h2>
      <div class="row"><label data-i18n="lblLang"></label>
        <div class="seg" data-key="language"><button data-v="en">ENGLISH</button><button data-v="pl">POLSKI</button></div></div>
      <div class="row"><label data-i18n="lblFolder"></label>
        <div class="inline"><input id="outputDir" readonly><button id="pick" class="btn sm" data-i18n="btnChange"></button></div></div>
      <label class="tog"><input type="checkbox" data-key="sound"><span class="sw"></span><span class="t" data-i18n="togSound"></span></label>
      <label class="tog"><input type="checkbox" data-key="notify"><span class="sw"></span><span class="t" data-i18n="togNotify"></span></label>
      <label class="tog"><input type="checkbox" data-key="autostart"><span class="sw"></span><span class="t" data-i18n="togAutostart"></span></label>
    </section>
  </div>

  <!-- ===================== CLIPS ===================== -->
  <div id="tab-clips" class="pane" hidden>
    <section class="player" id="player" hidden>
      <div class="vwrap paused" id="vwrap">
        <video id="vid" preload="metadata" playsinline></video>
        <button class="vbig" id="vbig" data-i18n-title="ttPlay"></button>
        <div class="verr" id="verr" hidden>
          <b data-i18n="vErrTitle"></b>
          <span data-i18n="vErrText"></span>
          <button class="btn" id="verrOpen" data-i18n="vErrOpen"></button>
        </div>
        <div class="vctl" id="vctl">
          <div class="seek" id="seek"><div class="seek-fill" id="seekFill"></div><div class="seek-knob" id="seekKnob"></div></div>
          <div class="vrow">
            <button id="vPlay" data-i18n-title="ttPlay"></button>
            <button id="vBack" data-i18n-title="ttBack"></button>
            <button id="vFwd" data-i18n-title="ttFwd"></button>
            <span class="vtime" id="vTime">0:00 / 0:00</span>
            <span class="sp"></span>
            <button id="vSpeed" class="txt" data-i18n-title="ttSpeed">1×</button>
            <button id="vMute" data-i18n-title="ttMute"></button>
            <input type="range" id="vVol" min="0" max="1" step="0.05" value="1" data-i18n-title="ttVol">
            <button id="vFull" data-i18n-title="ttFull"></button>
          </div>
        </div>
      </div>
      <div class="pbar">
        <div class="pname" id="pName"></div>
        <div class="pacts">
          <button class="btn sm" id="aFolder" data-i18n="actFolder"></button>
          <button class="btn sm" id="aOpen" data-i18n="actOpen"></button>
          <button class="btn sm danger" id="aDel" data-i18n="actDelete"></button>
        </div>
      </div>
    </section>

    <div class="clips-head">
      <h2><b>//</b> <span data-i18n="clipsTitle"></span></h2>
      <div><button id="refresh" class="btn sm" data-i18n="refresh"></button> <button id="openDir" class="btn sm" data-i18n="openFolder"></button></div>
    </div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" hidden>
      <b data-i18n="emptyTitle"></b>
      <span data-i18n-html="emptyText"></span>
    </div>
  </div>

  <footer class="foot">ROMAN CLIP · by Botipy · MIT</footer>
</div></div>

<div id="toast" class="toast" hidden></div>
<script src="strings.js"></script>
<script src="i18n.js"></script>
<script src="settings.js"></script>
</body>
</html>
