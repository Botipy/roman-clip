<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Roman Clip</title>
<link rel="stylesheet" href="settings.css">
</head>
<body>
<header>
  <div>
    <h1>Roman Clip</h1>
    <p class="sub">// edgerunner recorder</p>
  </div>
  <span id="state" class="pill">…</span>
</header>

<button id="clipNow" class="big">Zapisz klip teraz</button>

<section>
  <h2>Klip</h2>
  <label>Długość klipu (s) <input type="number" id="seconds" min="5" max="300"></label>
  <label>Dodatkowe sekundy po wywołaniu <input type="number" id="afterSeconds" min="0" max="30"></label>
  <label>Klatki na sekundę
    <select id="fps"><option>24</option><option>30</option><option>45</option><option>60</option><option>90</option><option>120</option></select>
  </label>
  <label>Rozdzielczość
    <select id="height"><option value="0">Natywna</option><option value="1440">1440p</option><option value="1080">1080p</option><option value="720">720p</option><option value="480">480p</option></select>
  </label>
  <label>Jakość
    <select id="quality"><option value="low">Niska</option><option value="medium">Średnia</option><option value="high">Wysoka</option><option value="ultra">Bardzo wysoka</option></select>
  </label>
  <label>Enkoder
    <select id="encoder"><option value="auto">Auto (GPU, jeśli jest)</option><option value="h264_nvenc">NVIDIA (NVENC)</option><option value="h264_amf">AMD (AMF)</option><option value="h264_qsv">Intel (QSV)</option><option value="libx264">Procesor (x264)</option></select>
  </label>
  <label>Ekran <select id="monitor"></select></label>
  <label>Dźwięk w klipie <select id="audioDevice"></select></label>
  <p class="hint">Dźwięk systemowy wymaga urządzenia typu „Stereo Mix” / „Miks stereo” (włącz w ustawieniach dźwięku Windowsa).</p>
</section>

<section>
  <h2>Wywołanie</h2>
  <label>Skrót klawiszowy
    <input id="hotkey" placeholder="kliknij i naciśnij kombinację" readonly>
  </label>
  <p class="hint" id="hotkeyMsg"></p>
  <label class="row"><input type="checkbox" id="voiceEnabled"> Komenda głosowa</label>
  <label>Fraza <input id="voicePhrase" placeholder="np. klip"></label>
  <label>Mikrofon <select id="micId"></select></label>
  <div id="modelBox">
    <button id="modelBtn">Pobierz model głosowy (ok. 50 MB, raz)</button>
    <div class="bar"><div id="modelBar"></div></div>
    <p class="hint" id="modelMsg"></p>
  </div>
  <p class="hint">Rozpoznawanie działa offline. Fraza musi być słowem znanym modelowi (polskie, zwykłe słowa).</p>
</section>

<section>
  <h2>Pliki i aplikacja</h2>
  <label>Folder klipów
    <div class="inline"><input id="outputDir" readonly><button id="pick">Zmień</button><button id="open">Otwórz</button></div>
  </label>
  <label class="row"><input type="checkbox" id="sound"> Dźwięk po zapisaniu</label>
  <label class="row"><input type="checkbox" id="notify"> Powiadomienie po zapisaniu</label>
  <label class="row"><input type="checkbox" id="autostart"> Uruchamiaj z Windowsem</label>
</section>

<script src="settings.js"></script>
</body>
</html>
